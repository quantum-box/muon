# Declare an independent workspace so Cargo does not try to merge this
# crate into the parent tachyon-apps workspace when muon is checked out
# as a submodule inside that monorepo.
[workspace]

[package]
name = "muon-desktop"
version = "0.3.1"
edition = "2021"
description = "Muon API Platform - Desktop Application"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
muon = { path = ".." }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# zerocopy 0.8.x uses core::arch AVX-512 intrinsics gated behind the
# `stdarch_x86_avx512` nightly feature, causing E0658 on stable Rust.
# Pin to 0.7.35 which predates the AVX-512 introduction.
[patch.crates-io]
zerocopy = { version = "=0.7.35" }
