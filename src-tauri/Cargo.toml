# Declare an independent workspace so Cargo does not try to merge this
# crate into the parent tachyon-apps workspace when muon is checked out
# as a submodule inside that monorepo.
[workspace]

[package]
name = "muon-desktop"
version = "0.3.1"
edition = "2021"
description = "Muon API Platform - Desktop Application"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
muon = { path = ".." }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
# Pin to avoid zerocopy 0.8.x which uses AVX-512 intrinsics requiring
# stdarch_x86_avx512 (nightly-only on stable Rust, causing E0658 on Windows).
# ahash 0.8.12 bumped zerocopy to ^0.8; ppv-lite86 0.2.21 also requires ^0.8.
# Pinning these older versions eliminates zerocopy 0.8.x from the dep tree.
ahash = "=0.8.11"
ppv-lite86 = "=0.2.20"

[build-dependencies]
tauri-build = { version = "2", features = [] }

