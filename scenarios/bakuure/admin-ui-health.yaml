name: bakuure Admin UI Health Check
description: Verify the bakuure admin UI is accessible and returns HTTP 200
tags:
  - bakuure
  - admin
  - health
  - smoke

config:
  base_url: https://bakuureadmin.n1.tachy.one
  timeout: 15

steps:
  - id: admin_ui_health
    name: Admin UI returns 200
    request:
      method: GET
      url: /
    expect:
      status: 200
