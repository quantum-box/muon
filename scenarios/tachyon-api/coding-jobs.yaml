name: Agent Coding Jobs API
description: Create and manage async coding jobs
tags:
  - tachyon
  - agent
  - coding-jobs

config:
  base_url: http://localhost:50154
  headers:
    Authorization: Bearer dummy-token
    x-operator-id: tn_01hjryxysgey07h5jz5wagqj0m
    Content-Type: application/json
  timeout: 30

steps:
  - id: list_providers
    name: List available coding job providers
    request:
      method: GET
      url: /v1/agent/coding-jobs/providers
    expect:
      status: 200

  - id: list_jobs
    name: List existing coding jobs
    request:
      method: GET
      url: /v1/agent/coding-jobs
    expect:
      status: 200
