name: Agent SSE Streaming
description: Execute agent and verify SSE event stream (say + attempt_completion)
tags: [tachyon, agent, sse]

config:
  base_url: https://api.n1.tachy.one
  headers:
    Authorization: Bearer ${TACHYON_JWT}
    x-operator-id: ${OPERATOR_ID}
    Content-Type: application/json
  timeout: 120  # agent応答に時間がかかる場合あり

steps:
  - id: create_chatroom
    name: Create chatroom
    request:
      method: POST
      url: /v1/llms/chatrooms
      body:
        name: "muon-sse-test"
    expect:
      status: 201
    bind:
      chatroom_id: "current.res.body.id"

  - id: execute_agent
    name: Execute agent and verify SSE stream
    request:
      method: POST
      url: "/v1/llms/chatrooms/{{steps.create_chatroom.chatroom_id}}/agent/execute"
      body:
        message: "こんにちは。1+1を教えて。"
    expect:
      status: 200
      headers:
        Content-Type: "text/event-stream"
      sse:
        has_events:
          - say
          - attempt_completion
        ends_with: attempt_completion
        # thinking や usage は任意（モデル依存）

  - id: cleanup
    name: Delete chatroom
    request:
      method: DELETE
      url: "/v1/llms/chatrooms/{{steps.create_chatroom.chatroom_id}}"
    expect:
      status: 200
